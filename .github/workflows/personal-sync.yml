name: Sync upstream and build personal rules

on:
  push:
    branches:
      - personal
    paths:
      - 'custom/**'
      - 'py/build_personal_rules.py'
      - 'py/test_personal_rules.py'
      - '.github/workflows/personal-sync.yml'
  schedule:
    # Once per day at 02:23 UTC (10:23 Asia/Shanghai).
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-rules-writer
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout personal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: personal
          fetch-depth: 0

      - name: Fetch upstream and origin branches
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Aethersailor/Custom_OpenClash_Rules.git ||
            git remote set-url upstream https://github.com/Aethersailor/Custom_OpenClash_Rules.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main personal

      - name: Build and verify personal outputs
        run: |
          set -euo pipefail
          python py/build_personal_rules.py
          python py/build_personal_rules.py --check

      - name: Publish personal outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- dist
          if git diff --cached --quiet; then
            echo "Personal outputs are already current."
          else
            git commit -m "chore(rules): refresh personal rule outputs"
            git push origin HEAD:personal
          fi

      - name: Update mirror branch while preserving workflows
        run: |
          set -euo pipefail
          expected_main="$(git rev-parse origin/main)"
          git switch --detach upstream/main
          # GITHUB_TOKEN cannot update files under .github/workflows. Keep the
          # fork's existing workflow tree while mirroring all other upstream
          # content, so rule updates do not require a separate PAT.
          git restore \
            --source=origin/main \
            --staged \
            --worktree \
            -- .github/workflows
          if git diff --cached --quiet; then
            mirror_ref="upstream/main"
          else
            git commit -m "chore(sync): mirror upstream except workflows"
            mirror_ref="HEAD"
          fi
          git push \
            --force-with-lease="refs/heads/main:${expected_main}" \
            origin "${mirror_ref}:main"
